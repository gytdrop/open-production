[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-production"
version = "0.1.0"
description = "IBM AI Builders Challenge submission — Open Production."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
production = "src.cli.__main__:main"

[tool.setuptools.packages.find]
where = [".", "src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]